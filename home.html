<div id="p-home" class="panel active">
  <div class="home-bar">
    <span class="home-eyebrow">슈퍼문 탐구</span>
  </div>
  <div class="orb-wrap">
    <div class="orb-rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
    <canvas id="moonCanvas" width="380" height="380"
      style="width:190px;height:190px;border-radius:50%;display:block;animation:orb-pulse 5s ease-in-out infinite"></canvas>
  </div>
  <div class="type-badge" id="typeBadge"></div>
  <div class="date-sub" id="dateSub"></div>
  <div class="cards">
    
    <div class="card" style="border-color:rgba(242,192,64,.3);background:rgba(242,192,64,.06)">
      <div class="card-row" style="margin-bottom:8px">
        <span class="lbl">📅 오늘 날짜 설정</span>
        <span style="font:400 9px/1 var(--mono);color:rgba(242,192,64,.5)">수식·일정 기준</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="date" id="userTodayInput"
          style="flex:1;background:rgba(6,8,15,.6);border:1px solid rgba(242,192,64,.35);border-radius:8px;
                 padding:9px 12px;color:var(--paper);font:600 14px/1 var(--mono);outline:none"
          >
      </div>
      <div id="userTodayLabel" style="font:400 10px/1 var(--mono);color:rgba(242,192,64,.6);margin-top:6px">
        기준일: 오늘
      </div>
    </div>
    <div class="card">
      <div class="card-row"><span class="lbl">지구까지 거리</span><span class="val gold" id="distVal">—</span></div>
      <div class="prox-wrap">
        <div class="card-row"><span class="lbl">근지점 근접도</span><span class="val" id="proxVal">—</span></div>
        <div class="prox-track"><div class="prox-fill" id="proxFill" style="width:0"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-row"><span class="lbl">위상</span><span class="val" id="phaseVal">—</span></div>
      <div class="card-row" style="margin-top:6px">
        <span class="lbl" style="font-size:9px">1/T = 1/T(삭망월) − 1/T(이상월)</span>
        <span class="val gold" style="font-size:12px" id="periodVal">≈ 412일</span>
      </div>
    </div>
    <div class="next-banner" onclick="switchTab('sched')">
      <div><div class="nb-lbl">다음 슈퍼문</div><div class="nb-date" id="nextDate">—</div></div>
      <div class="nb-dday" id="nextDday">D-?</div>
    </div>
    <div class="next-banner" style="border-color:rgba(224,120,48,.22)" onclick="switchTab('sched')">
      <div><div class="nb-lbl" style="color:rgba(224,120,48,.5)">다음 준슈퍼문</div><div class="nb-date" id="nextQDate" style="color:var(--orange)">—</div></div>
      <div class="nb-dday" id="nextQDday" style="color:var(--orange)">D-?</div>
    </div>
  </div>
</div>

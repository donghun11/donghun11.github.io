<div id="p-sched" class="panel">

  
  <div class="sched-top">
    <div class="sched-hdr"><span class="sched-title">🗓 슈퍼문 일정</span></div>
    <div class="sched-legend">
      <div class="sleg-title">분류 기준 — 근지점 근접도</div>
      <div class="prox-gauge">
        <div class="pg-track">
          <div class="pg-marker" style="left:86%;background:var(--orange)"></div>
          <div class="pg-marker" style="left:90%;background:var(--gold)"></div>
        </div>
        <div class="pg-zones">
          <span class="pg-zone-lbl" style="left:38%;color:rgba(240,236,224,.3)">보름달</span>
          <span class="pg-zone-lbl" style="left:86.5%;color:var(--orange)">준슈퍼</span>
          <span class="pg-zone-lbl" style="left:90.5%;color:var(--gold)">슈퍼</span>
        </div>
        <div class="pg-axis"><span>0%</span><span>50%</span><span>86%</span><span>90%</span><span>100%</span></div>
      </div>
      <div class="leg-rows">
        <div class="leg-row"><span class="leg-icon">🌕</span><div class="leg-text"><div class="leg-name gold">슈퍼문 (≥90%)</div><div class="leg-desc">근지점 완전 근접. ≤365,950 km. 주기≈412일</div></div></div>
        <div class="leg-row"><span class="leg-icon">🌔</span><div class="leg-text"><div class="leg-name orange">준슈퍼문 (86~90%)</div><div class="leg-desc">근지점 14% 이내. 뉴스 기준. 주기≈210일</div></div></div>
        <div class="leg-row"><span class="leg-icon">🩸</span><div class="leg-text"><div class="leg-name red">슈퍼 블러드문</div><div class="leg-desc">개기월식+슈퍼문. 사로스 주기≈54년</div></div></div>
        <div class="leg-row"><span class="leg-icon">🌕🌑</span><div class="leg-text"><div class="leg-name blue">슈퍼 반영월식</div><div class="leg-desc">반영월식+슈퍼문. ≈5~6년 주기</div></div></div>
      </div>
    </div>
    
    <div class="sched-today-bar">
      <span class="sched-today-lbl">📅 기준일</span>
      <span class="sched-today-val" id="schedTodayVal">—</span>
    </div>
    
    <div class="sched-filters">
      <button class="fc on" data-f="all" onclick="setF(this,'all')"><span class="fc-icon">📋</span>전체</button>
      <button class="fc" data-f="super" onclick="setF(this,'super')"><span class="fc-icon">🌕</span>슈퍼문</button>
      <button class="fc" data-f="quasi" onclick="setF(this,'quasi')"><span class="fc-icon">🌔</span>준슈퍼문</button>
      <button class="fc" data-f="blood" onclick="setF(this,'blood')"><span class="fc-icon">🩸</span>블러드문</button>
      <button class="fc" data-f="penumbral" onclick="setF(this,'penumbral')"><span class="fc-icon">🌕🌑</span>반영월식</button>
      <button class="fc" data-f="special" onclick="setF(this,'special')"><span class="fc-icon">✨</span>특수</button>
      <button class="fc" data-f="future" onclick="setF(this,'future')"><span class="fc-icon">🔮</span>미래</button>
      <button class="fc" data-f="past" onclick="setF(this,'past')"><span class="fc-icon">📜</span>과거</button>
    </div>
  </div>

  
  <div class="sched-list" id="schedList"></div>
</div>
